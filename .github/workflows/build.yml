name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: enchant-planner-${{ matrix.mc }}
          path: build/libs/*.jar

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Enchant Planner ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: jars/*.jar
