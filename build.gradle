plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Per-Minecraft-version settings live in versions/<mc>.properties; pick one with -Pmc=<version>.
def mcProps = new Properties()
file("versions/${project.mc}.properties").withInputStream { mcProps.load(it) }
mcProps.each { k, v -> project.ext.set(k, v) }

version = "${project.mod_version}+${project.mc}"

base {
	archivesName = 'enchant-planner'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = [version: project.version, minecraft_dependency: project.minecraft_dependency]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Client game test: opens an anvil in a fresh world, clicks the planner button and takes
// screenshots. Run with ./gradlew runClientGameTest [-Pmc=26.3]
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "enchant_planner_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
